# --- CAMERA --- #
# Camera configuration for the Porter telemetry system.
# The camera configuration includes the camera name, sensor core number, 
# exposure time, gain, image format, maximum framerate, number of threads 
# for writing images to disk, and verbosity of the camera output.
camera:
  name: Alvium                                          # Name of the camera
  core: 3                                               # Sensor core number
  exposure: 5000                                        # Exposure time in microseconds
  gain: 0.0                                             # Gain in dB
  format: BayerRG8                                      # Image format
  max_framerate: 5                                      # Maximum framerate in frames per second
  writing_threads: 2                                    # Number of threads for writing images to disk
  verbosity: False                                      # Verbosity of the camera output

# --- POINTING CONTROLLER --- #
# Pointing controller configuration for the Porter telemetry system.
# The pointing controller is responsible for controlling the gimbal and 
# UAV to point at a specific location or object.
pointing_controller:
  name: lager                                           # Name of the pointing controller

  gimbal:
    name: Gremsy T7                                     # Name of the gimbal
    simulator: False                                    # Whether to use a simulator for the gimbal
    connection:
      type: serial                                      # Connection type
      protocol: mavlink                                 # Protocol used for communication with the gimbal
      port: /dev/ttyAMA4                                # Serial port for the gimbal
      baudrate: 115200                                  # Baud rate for the gimbal
      timeout: 3                                        # Timeout in seconds
    telemetry:
      heartbeat_frequency: 1                            # Heartbeat frequency in Hz
      frequency: 50                                     # Telemetry frequency in Hz

  uav:
    name: DJI M600                                      # Name of the UAV
    simulator: False                                    # Whether to use a simulator for the UAV
    connection:
      type: serial                                      # Connection type
      protocol: DJI OSDK                                # Protocol used for communication with the UAV  
      port: /dev/ttyAMA1                                # Serial port for the UAV
      baudrate: 115200                                  # Baud rate for the UAV
      timeout: 3                                        # Timeout in seconds
    telemetry:
      frequency: 50  # Hz                               # Telemetry frequency in Hz

  poi:
    name: POI                                           # Name of the point of interest
    latitude: 45.513655422583646                        # Latitude of the point of interest
    longitude: 9.211336171408478                        # Longitude of the point of interest
    altitude: 300                                       # Altitude of the point of interest in meters
    max_distance: 1000.0                                # Maximum distance from the point of interest in meters

# --- POSITION SOURCE --- #
# Position source configuration for the Porter telemetry system.
# Position is used to determine the location of the UAV and/or the payload.
position_source:
  mode: auto                                              # auto | payload | uav
  uav_max_age_s: 2.0                                      # UAV source usable only if the last uav telemetry packet is newer than this
  uav_ok_health: [34, 48, 50]                             # rtk_pos_health values that count as a valid UAV position fix (34 = RTK float dm accuracy, 
                                                                                                                        # 48 = RTK fixed cm accuracy, 
                                                                                                                        # 50 = RTK fixed mm accuracy)
  uav_hold_s: 10                                          # auto: UAV position source must stay valid this long before switching back to it
  payload_max_age_s: 2.0                                  # Payload source usable only if its last position is newer than this
  payload_min_fix: 3                                      # Payload source gpsFix needed (3 = 3D fix)


