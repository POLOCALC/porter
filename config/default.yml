# --- GLOBAL PARAMETERS --- #
# Global parameters for the Porter telemetry system.
global:
  name: porter                                          # Name of the configuration
  version: 4.1                                          # Version of the flight software
  description: Configuration for Porter                 # Description of the configuration
  autostart_camera: True                                # Whether to start the camera automatically
  autostart_poi_tracking: True                          # Whether to start POI tracking automatically
  disk_guard:
    min_free_gb: 0.8                                    # Minimum free space in GB allowed before stopping acquisition
    start_min_free_gb: 5.0                              # Minimum free space in GB to start acquisition
    stop_margin_s: 30                                   # Margin in seconds to stop acquisition
    warn_margin_s: 1200                                 # Margin in seconds to warn about low disk space
    interval_s: 3                                       # Interval in seconds to check disk space
    window_s: 45                                        # Window in seconds to compute an average disk space usage

# --- SENSORS --- #
# Sensor configuration for the Porter telemetry system. 
# Each sensor has its own configuration block, which includes 
# the sensor name, core number, connection type and parameters,
# sensor information, and specific configuration settings.
sensors:
  GPS_1:                                                # GPS sensor configuration
    name: ZED-F9P                                       # Name of the sensor
    sensor_core: 3                                      # Sensor core number
    connection:
      type: serial                                      # Connection type
      parameters:
        port: /dev/ttyAMA0                              # Serial port for the GPS sensor
        baudrate: 115200                                # Baud rate for the GPS sensor
    sensor_info:
      type: GPS                                         # Type of the sensor
      manufacturer: UBlox                               # Manufacturer of the sensor
    configuration:
        NMEA1:
          output:
            port: UART1                                 # Output port for NMEA messages
            set: False                                  # Whether to set the output port for NMEA messages
        UBX:
          output:
            port: UART1                                 # Output port for UBX messages
            set: True                                   # Whether to set the output port for UBX messages
        RATE:
          value: 2                                      # Rate of the GPS sensor in Hz
        UBX_MSG:
          output_port: UART1                            # Output port for UBX messages
          NAV: [
            'POSECEF',                                  # this is needed to get the position in ECEF coordinates
            'POSLLH',                                   # this is needed to get the position in latitude, longitude, and height
            'CLOCK',                                    # this is needed to get the clock information
            'STATUS'                                    # this is needed to get the 3D fix status
            ]
          RXM: [
            'RAWX',                                     # this is needed to get the raw measurements
            'SFRBX'                                     # this is needed to get the raw measurements
            ]
        NMEA_MSG:
          output_port: UART2                            # Output port for NMEA messages
          ID : [
            'RMC',                                      # this is needed to get the recommended minimum specific GPS/Transit data
            'GST'                                       # this is needed to get the GPS pseudorange noise statistics
          ]

  ADC_1:
    name: ADS1015                                       # Name of the sensor
    sensor_core: 1                                      # Sensor core number
    connection:
      type: I2C                                         # Connection type
      parameters:
        bus: 4                                          # I2C bus number
        address: 0x48                                   # I2C address of the sensor
    sensor_info:
        type: ADC                                       # Type of the sensor
        manufacturer: ADS                               # Manufacturer of the sensor
    configuration: 
      gain: 16                                          # Gain setting for the ADC
      data_rate: 1600                                   # Data rate for the ADC in samples per second

  IMX5_1:
      name: IMX5-Sensors                                # Name of the sensor
      sensor_core: 2                                    # Sensor core number
      connection:
        type: serial                                    # Connection type
        parameters:
          device: /dev/ttyACM0                          # Serial device for the IMX5 sensor
          baudrate: 921600                              # baudrate
      sensor_info:
        type: IMX5                                      # Type of the sensor
        manufacturer: InertialSense                     # Manufacturer of the sensor
      configuration:
        imu_data_rate: 1000                             # IMU data rate in Hz
        ins_data_rate: 142                              # INS data rate in Hz

  DAC_1:
    name: MCP4725                                       # Name of the sensor
    connection:
      type: I2C                                         # Connection type
      parameters:
        bus: 1                                          # I2C bus number
        address: 0x60                                   # I2C address of the sensor
    sensor_info:
        type: DAC                                       # Type of the sensor
        manufacturer: MCP                               # Manufacturer of the sensor
    configuration: 
      voltage: 2.0                                      # Output voltage for the DAC
      max_voltage: 3.3                                  # Maximum output voltage for the DAC

  INERTIAL_1:
    name: Inertial                                      # Name of the sensor
    sensor_core: 2                                      # Sensor core number  
    connection:
      type: I2C                                         # Connection type
      parameters:
        bus: 3                                          # I2C bus number
    sensor_info:
        type: Inertial                                  # Type of the sensor
        manufacturer: Varios                            # Manufacturer of the sensor
    configuration:
      imu: True                                         # Whether to use the IMU
      imu_model: asm330lhh                              # Model of the IMU (asm330lhh or mpu6050)
      data_rate: 150                                    # Data rate for the inertial sensor in Hz

  # LM76_1:
  #   name: LM76-Temp                                     # Name of the sensor
  #   sensor_core: 2                                      # Sensor core number
  #   connection:
  #     type: I2C                                         # Connection type
  #     parameters:
