# single channel
source:
    name: synthhd
    config:
        devpath: /dev/ttyACM0                               # Serial port for the sensor
        channel: 0     			            # RF output channel to enable
        freq: 93                                         # Frequency in GHz
        mult_factor: 6                                    # Multiplication factor for the frequency
        power: 1                                         # Power in dBm
        mod_amp: 25                                       # Modulation amplitude in dBm
        mod_freq: 37                                      # Modulation frequency in Hz
	mod_funct: square_wave      			    # AM function 'square_wave' or 'sine'
	
