source:
  name: synthhd
  config:
    port: /dev/ttyACM0   # Serial port for the sensor
    channel: 0              # RF output channel to enable
    freq: 93                # Frequency in GHz
    mult_factor: 6          # Multiplication factor for the frequency
    power: -10                # Power in dBm
    mod_amp: 5             # Modulation amplitude in dBm
    mod_freq: 10            # Modulation frequency in Hz
    mod_funct: sine  # AM function 'square_wave' or 'sine'

sensors:
  ADC_1:
    name: ADS1015         # Name of the sensor
    sensor_core: 1        # Sensor core number
    connection:
      type: I2C           # Connection type
      parameters:
        bus: 4            # I2C bus number
        address: 0x48     # I2C address of the sensor
    sensor_info:
      type: ADC           # Type of the sensor
      manufacturer: ADS   # Manufacturer of the sensor
    configuration:
      gain: 16            # Gain setting for the ADC
      data_rate: 1600     # Data rate for the ADC in samples per second
