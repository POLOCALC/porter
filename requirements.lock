# PORTER Python packages, pinned: install_porter.sh installs exactly these into the porter venv.
# Taken on 2026-11-16 from `pip freeze` of the working flight Pi (Raspberry Pi 5, Raspberry Pi OS trixie,
# Python 3.13), restricted to what porter and its local modules (lager, sour_core, pyalvium, pyalvium_csi)
# need, with all their dependencies. The local modules and vmbpy are installed separately by the installer.
#
# Change a version only on purpose, after testing it on the Pi, then regenerate the whole list.
# Notes:
# - Adafruit-Blinka is kept at 9.x: 10.x needs the gpiod bindings and is not tested on the payload yet.
# - lgpio: Blinka 9.x drives the Pi 5 GPIO through it but doesn't declare it. Built from source
#   (with its bundled C library, PYPI=1 in install_porter.sh; needs swig from the apt step), like PyYAML and RPi.GPIO.
# - six: needed by python-dateutil; not in the freeze (it comes from the OS there), pinned to Debian trixie's version.
