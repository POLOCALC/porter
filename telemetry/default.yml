global:
  name: porter
  version: 4.0
  description: Telemetry configuration for Porter
  autostart_camera: True
  autostart_poi_tracking: False

sensors:
  GPS_1:
    name: ZED-F9P
    sensor_core: 3
    connection:
      type: serial
      parameters:
        port: /dev/ttyAMA0
        baudrate: 115200
    sensor_info:
      type: GPS
      manufacturer: UBlox
    configuration:
        NMEA1:
          output:
            port: UART1
            set: False
        UBX:
          output:
            port: UART1
            set: True
        RATE:
          value: 2
        UBX_MSG:
          output_port: UART1
          NAV: [
            'POSECEF',
            'POSLLH',
            'CLOCK',
            'STATUS' # this is needed to get the fix status
            ]
          RXM: [
            'RAWX',
            'SFRBX'
            ]
        NMEA_MSG:
          output_port: UART2
          ID : [
            'RMC',
            'GST'
          ]
  
  ADC_1:
    name: ADS1015
    sensor_core: 1
    connection:
      type: I2C
      parameters:
        bus: 4
        address: 0x48
    sensor_info:
        type: ADC
        manufacturer: ADS
    configuration: 
      gain: 16
      data_rate: 1600

  IMX5_1:
      name: IMX5-Sensors
      sensor_core: 2
      connection:
        type: serial
        parameters:
          device: /dev/ttyACM0
          baudrate: 921600
      sensor_info:
        type: IMX5
        manufacturer: InertialSense
      configuration:
        imu_data_rate: 1000
        ins_data_rate: 142

  DAC_1:
    name: MCP4725
    connection:
      type: I2C
      parameters:
        bus: 1
        address: 0x60
    sensor_info:
        type: DAC
        manufacturer: MCP
    configuration: 
      voltage: 2.0
      max_voltage: 3.3

  INERTIAL_1:
    name: Inertial
    sensor_core: 2
    connection:
      type: I2C
      parameters:
        bus: 3
    sensor_info:
        type: Inertial
        manufacturer: Varios
    configuration: 
      data_rate: 150

  LM76_1:
    name: LM76-Temp
    sensor_core: 2
    connection:
      type: I2C
      parameters:
        bus: 1
        address: 0x4B
    sensor_info:
      type: LM76
      manufacturer: TexasInstruments
    configuration:
      interval: 10
      tcrit: 35
      thyst: 0
      tlow: 10
      thigh: 40
      # Configuration register (power-up defaults shown)
      int_mode: comparator        # comparator | event
      tcrit_polarity: active_high  # active_low | active_high
      int_polarity: active_low    # active_low | active_high
      fault_queue: false          # true: 4 consecutive faults needed to trip

source:
  name: VALON-5019
  port: /dev/ttyAMA3
  baudrate: 115200
  freq: 144
  power: -6.5
  mod_amp: 15
  mod_freq: 0.2
  mult_factor: 12

camera:
  name: Alvium
  core: 3
  exposure: 5000
  gain: 0.0
  format: BayerRG8
  max_framerate: 5
  writing_threads: 2
  verbosity: False


